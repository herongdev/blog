services:
  app:
    image: ${APP_IMAGE:-zhixu-chat:local}
    build:
      context: .
      args:
        APP_REVISION: ${APP_REVISION:-unknown}
    env_file:
      - path: ${APP_ENV_FILE:-.env.runtime}
        required: false
        format: raw
    environment:
      APP_BIND_ADDRESS: 0.0.0.0
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3001}
      APP_CHAT_TIMEOUT_MS: ${APP_CHAT_TIMEOUT_MS:-120000}
      APP_MAX_ACTIVE_GENERATIONS: ${APP_MAX_ACTIVE_GENERATIONS:-8}
      PORT: "3001"
      NODE_OPTIONS: --max-old-space-size=384
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
