services:
  app:
    environment:
      APP_ORIGIN: https://${SITE_HOST:?Set SITE_HOST to your public domain}
  gateway:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    environment:
      SITE_HOST: ${SITE_HOST:?Set SITE_HOST to your public domain}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL for certificate renewal notices}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/app.caddy:/etc/caddy/app.caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    secrets:
      - demo_auth
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  demo_auth:
    file: ${DEMO_AUTH_FILE:-./.secrets/demo-auth.caddy}

volumes:
  caddy_data:
  caddy_config:
