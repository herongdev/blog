# Privacy-safe route classes: never log query strings or arbitrary URL paths here.
map $uri $zhixu_log_route {
    default "other";
    /api/chat "chat";
    /api/providers "providers";
    /api/healthz "health";
}
log_format zhixu_timing escape=json
    '{"at":"$time_iso8601","route":"$zhixu_log_route","method":"$request_method",'
    '"status":$status,"requestBytes":$request_length,"responseBytes":$body_bytes_sent,'
    '"durationSeconds":"$request_time","appConnectSeconds":"$upstream_connect_time",'
    '"appHeadersSeconds":"$upstream_header_time","appResponseSeconds":"$upstream_response_time",'
    '"requestId":"$upstream_http_x_request_id"}';

# Existing host Nginx terminates TLS; only this application's loopback port is exposed.
server {
    listen 80;
    listen [::]:80;
    server_name chat.herong.info;
    return 301 https://chat.herong.info$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.herong.info;

    ssl_certificate /etc/nginx/ssl/chat.herong.info/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/chat.herong.info/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:zhixu_tls:1m;
    ssl_session_timeout 1d;
    server_tokens off;

    # Compress assets, while excluding text/event-stream from compression.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/chat.herong.info.access.log;
    access_log /var/log/nginx/chat.herong.info.timing.log zhixu_timing;
    error_log /var/log/nginx/chat.herong.info.error.log;

    location / {
        proxy_pass http://127.0.0.1:24301;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Do not batch SSE output or keep generation alive after the client closes.
        proxy_buffering off;
        proxy_cache off;
        proxy_ignore_client_abort off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }
}
