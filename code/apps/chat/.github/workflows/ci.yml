name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run container:build -- --build-arg APP_REVISION=${{ github.sha }}
      - run: npm run test:container
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: container-acceptance
          path: |
            output/container/report.json
            output/container/failure.log
            output/playwright/container/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: output/playwright
          retention-days: 7
