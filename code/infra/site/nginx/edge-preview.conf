# Include only inside the EXISTING 101.96.210.172 HTTPS server block.
# The artifact must be built with PUBLIC_BASE_PATH=/site-preview/.
# No DNS, certificate, /dev, /test-dev, /dev-admin or root-app changes.
location = /site-preview {
    return 308 /site-preview/;
}
location ^~ /site-preview/ {
    proxy_pass http://127.0.0.1:24380/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /site-preview;
    proxy_redirect off;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
