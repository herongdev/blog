# Shared server-side TLS settings for the independently deployed old origin.
# Confirm the CA path with nginx -t on the actual host before installing.
proxy_http_version 1.1;
proxy_set_header Host herong.info;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_ssl_server_name on;
proxy_ssl_name herong.info;
proxy_ssl_verify on;
proxy_ssl_verify_depth 3;
proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
proxy_redirect off;
