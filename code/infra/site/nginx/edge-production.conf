# Include only after independently preserving /projects/enterprise/ and
# /projects/enterprise/sampling-station/api/ (including SSE) at the edge.
# These services retain their existing paths and deployments; never proxy to
# https://herong.info from this server, which would loop after DNS cutover.
# Do not include this root location in the existing IP-hosted server block.
# The production artifact must be built with PUBLIC_BASE_PATH=/.
# Browsers that opened an article before cutover may still request its previous
# hashed VitePress chunks. New assets win; missing old chunks stay on the old
# independently retained origin until that origin is deliberately retired.
location ^~ /assets/ {
    proxy_pass http://127.0.0.1:24380;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors on;
    error_page 404 = @herong_old_static_assets;
}
location @herong_old_static_assets {
    proxy_pass https://115.190.214.176;
    include /etc/nginx/snippets/herong-enterprise-origin-headers.conf;
}

location / {
    proxy_pass http://127.0.0.1:24380;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_redirect off;
}
