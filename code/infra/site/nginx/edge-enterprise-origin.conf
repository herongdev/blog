# Include in the formal herong.info HTTPS server only.
# The independently running enterprise/sampling services stay on their old host.
# The literal IP is intentional: resolving herong.info here would loop after DNS.
# To change this origin, first verify its identity, HTTPS/SNI, API and SSE; change
# both proxy_pass directives together. Never use root /api or strip the path.
location = /projects/enterprise {
    return 308 /projects/enterprise/;
}
location = /projects/enterprise/sampling-station {
    return 308 /projects/enterprise/sampling-station/;
}
location = /projects/enterprise/sampling-station/api {
    return 308 /projects/enterprise/sampling-station/api/;
}
# This real portfolio detail is owned by the new static site, not the old
# independently deployed enterprise-home application.
location = /projects/enterprise/enterprise-platform {
    return 308 /projects/enterprise/enterprise-platform/;
}
location ^~ /projects/enterprise/enterprise-platform/ {
    proxy_pass http://127.0.0.1:24380;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_redirect off;
}
location ~ ^/projects/enterprise/sampling-station/api/v1/sampling/stations/[^/]+/events$ {
    proxy_pass https://115.190.214.176;
    include /etc/nginx/snippets/herong-enterprise-origin-headers.conf;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    add_header X-Accel-Buffering no;
    add_header Cache-Control no-cache always;
}
location /projects/enterprise/ {
    proxy_pass https://115.190.214.176;
    include /etc/nginx/snippets/herong-enterprise-origin-headers.conf;
    # Ordinary JSON stays buffered; only the events location streams unbuffered.
    proxy_read_timeout 180s;
}
