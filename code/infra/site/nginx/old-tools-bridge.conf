# Old server only: DNS caches may still reach it during the migration window.
# Forward tool requests to the new primary rather than allowing two data writers.
location = /file-tools {
    client_max_body_size 100m;
    proxy_pass https://101.96.210.172;
    proxy_http_version 1.1;
    proxy_set_header Host herong.info;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_ssl_server_name on;
    proxy_ssl_name herong.info;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
    proxy_read_timeout 180s;
    proxy_redirect off;
}
location ^~ /file-tools/ {
    client_max_body_size 100m;
    proxy_pass https://101.96.210.172;
    proxy_http_version 1.1;
    proxy_set_header Host herong.info;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_ssl_server_name on;
    proxy_ssl_name herong.info;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
    proxy_read_timeout 180s;
    proxy_redirect off;
}
