# New server: install only after the main/tool containers and production TLS
# files have passed validation. Existing IP and product servers stay separate.
server {
    listen 80;
    listen [::]:80;
    server_name herong.info www.herong.info;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/herong-site-acme;
        try_files $uri =404;
    }
    location / { return 308 https://herong.info$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name herong.info;
    ssl_certificate /etc/letsencrypt/live/herong.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/herong.info/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/herong-site-enterprise-origin.conf;
    include /etc/nginx/snippets/herong-site-tools.conf;
    include /etc/nginx/snippets/herong-site-root.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.herong.info;
    ssl_certificate /etc/letsencrypt/live/herong.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/herong.info/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://herong.info$request_uri;
}
