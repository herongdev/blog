worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
        text/xml application/xml application/rss+xml application/atom+xml
        application/json application/feed+json image/svg+xml;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # The edge strips this fixed preview prefix. Never reflect an arbitrary header.
    map $http_x_forwarded_prefix $site_prefix {
        default "";
        /site-preview /site-preview;
        /site-preview/ /site-preview;
    }
    map $uri $legacy_target {
        default "";
        ~^/projects/ai-chat(?:\.html|/)?$ /projects/ai-agent/ai-chat/;
        ~^/projects/minicodex(?:\.html|/)?$ /projects/ai-agent/minicodex/;
        ~^/projects/aurumchart(?:\.html|/)?$ /projects/finance/aurumchart/;
        ~^/projects/trading-system(?:\.html|/)?$ /projects/finance/trading-system/;
        ~^/projects/shopthrive(?:\.html|/)?$ /projects/fullstack/shopthrive/;
        ~^/projects/enterprise-platform(?:\.html|/)?$ /projects/enterprise/enterprise-platform/;
        ~^/projects/fields/(?<legacy_field>ai-agent|enterprise|finance|fullstack|video-live)(?:\.html|/)?$ /projects/$legacy_field/;
        ~^/3d/?$ /projects/enterprise/;
    }
    include /etc/nginx/conf.d/*.conf;
}
