server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    port_in_redirect off;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;

    # The main image never proxies back to its own public domain.
    # Enterprise static pages, the sampling API and SSE belong to edge routes.
    if ($legacy_target != "") {
        return 301 $site_prefix$legacy_target$is_args$args;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
    location = /404 {
        return 404;
    }
    location = /404.html {
        internal;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Some historic article slugs end in .js/.xml although their actual output
    # is <slug>.html. Resolve these clean URLs before the static-assets regex.
    location ^~ /posts/ {
        try_files $uri.html $uri/index.html $uri =404;
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.(?:css|js|mjs|json|map|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|webm|mp4|xml|txt)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        # Serve actual SSG output, including VitePress clean URLs. No SPA fallback.
        # Testing index files before directories avoids losing the edge prefix.
        try_files $uri.html $uri/index.html $uri =404;
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
    }
}
