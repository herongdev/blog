server {
    listen 80;
    listen [::]:80;
    server_name auth.herong.info;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/herong-identity-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://auth.herong.info$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auth.herong.info;
    ssl_certificate /etc/letsencrypt/live/auth.herong.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.herong.info/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:24321;
        proxy_http_version 1.1;
        proxy_set_header Host auth.herong.info;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Connection "";
        client_max_body_size 64k;
        client_body_timeout 15s;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        proxy_buffering off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        access_log off;
        error_log /dev/null crit;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
