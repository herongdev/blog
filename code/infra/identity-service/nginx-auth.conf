# Legacy endpoints and approved WeChat callback only. The UI redirects to auth.herong.info.
# Include inside the existing dev.herong.info HTTPS server. Preserve /auth/ in proxy_pass.
location = /auth {
    return 308 /auth/;
}

location ^~ /auth/ {
    proxy_pass http://127.0.0.1:24321;
    proxy_http_version 1.1;
    proxy_set_header Host dev.herong.info;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Connection "";
    client_max_body_size 64k;
    client_body_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_buffering off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    access_log off;
    # Upstream error logs can include the callback query; the service emits redacted diagnostics.
    error_log /dev/null crit;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
}
