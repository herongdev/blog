# First issuance only; deploy.py replaces this with nginx-auth-domain.conf after signing.
server {
    listen 80;
    listen [::]:80;
    server_name auth.herong.info;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/herong-identity-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
