server {
    listen 80;
    listen [::]:80;
    server_name tingji.herong.info;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tingji/acme;
        try_files $uri =404;
    }
    location / { return 308 https://tingji.herong.info$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tingji.herong.info;
    ssl_certificate /etc/letsencrypt/live/tingji.herong.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tingji.herong.info/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/tingji/current;
    index index.html;
    charset utf-8;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; script-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Cache-Control "no-cache" always;
    location / { try_files $uri $uri/ =404; }
}
