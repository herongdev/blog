# Canonical public paths for the enterprise field and sampling-station demo.
# Include in the old origin's herong.info TLS server on 115.190.214.176.
# The main-site server proxies these public paths to that origin; this is not a
# main-site CI artifact. Keep the main-site enterprise-platform exception there.

# Legacy path from the 2026-09-23 mistaken manual deployment. Keep only a
# redirect so it cannot become a second public home for either application.
location = /3d {
  return 308 /projects/enterprise/;
}

location = /3d/ {
  return 308 /projects/enterprise/;
}

location = /projects/enterprise {
  return 308 /projects/enterprise/;
}

# The field home is an independent static release, not a future blog merge.
location = /projects/enterprise/ {
  root /var/www/herong-demos/enterprise-home/current/web;
  try_files /projects/enterprise/index.html =404;
}

location = /projects/fields/enterprise {
  return 308 /projects/enterprise/;
}

location = /projects/fields/enterprise/ {
  return 308 /projects/enterprise/;
}

location = /projects/enterprise/sampling-station {
  return 308 /projects/enterprise/sampling-station/;
}

location = /projects/enterprise/sampling-station/api {
  return 308 /projects/enterprise/sampling-station/api/;
}

location ~ ^/projects/enterprise/sampling-station/api/v1/sampling/stations/[^/]+/events$ {
  rewrite ^/projects/enterprise/sampling-station/api/(.*)$ /api/$1 break;
  proxy_pass http://127.0.0.1:24310;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 1h;
  add_header X-Accel-Buffering no;
}

location /projects/enterprise/sampling-station/api/ {
  proxy_pass http://127.0.0.1:24310/api/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /projects/enterprise/sampling-station/assets/ {
  root /var/www/herong-demos/sampling-station/current/web;
  try_files $uri =404;
  add_header Cache-Control "public, max-age=31536000, immutable";
}

location ^~ /projects/enterprise/sampling-station/source-ui/ {
  root /var/www/herong-demos/sampling-station/current/web;
  try_files $uri =404;
  add_header Cache-Control "no-cache";
}

location ^~ /projects/enterprise/sampling-station/ {
  root /var/www/herong-demos/sampling-station/current/web;
  try_files $uri $uri/ /projects/enterprise/sampling-station/index.html;
  add_header Cache-Control "no-cache" always;
}

# Keep this broader field-home route after the more specific sampling-station
# routes. Nginx still chooses the longest prefix for the concrete demo.
location ^~ /projects/enterprise/ {
  root /var/www/herong-demos/enterprise-home/current/web;
  # This application has no client-side routes: missing media or scripts must
  # return 404 instead of a successful HTML response.
  try_files $uri $uri/ =404;
}
