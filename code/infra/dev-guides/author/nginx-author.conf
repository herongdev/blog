# Install as snippets/herong-dev-guides-author-domain.conf in the production HTTPS server.
location = /admin { return 308 /admin/$is_args$args; }
# Only the authenticated binary upload endpoint receives a larger body/time budget.
location = /admin/api/publishing/assets {
    access_log off;
    client_max_body_size 2g;
    client_body_timeout 1200s;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:24320/api/publishing/assets;
    proxy_http_version 1.1;
    proxy_set_header Host dev.herong.info;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_read_timeout 1200s;
    proxy_send_timeout 1200s;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-store" always;
}
location ^~ /admin/ {
    # OAuth code/state and private article paths must not enter Nginx access logs.
    access_log off;
    client_max_body_size 16m;
    proxy_pass http://127.0.0.1:24320/;
    proxy_http_version 1.1;
    proxy_set_header Host dev.herong.info;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_hide_header X-Powered-By;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-store" always;
}
