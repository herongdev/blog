# Replace the old snippets/herong-dev-guides-author.conf in the IP HTTPS server.
# Stale forms must reload on the canonical origin, never forward credentials.
location = /dev-admin {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    return 308 https://dev.herong.info/admin/$is_args$args;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
location ^~ /dev-admin/ {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    # Match the original URI to preserve escaped characters and the query string.
    if ($request_uri ~ "^/dev-admin/(.*)$") {
        return 308 https://dev.herong.info/admin/$1;
    }
    return 400;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
