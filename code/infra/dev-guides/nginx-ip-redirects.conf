# Replaces the old IP static locations only after both domain sites are verified.
# Include inside the existing IP HTTPS server; /dev-admin/ remains separate.
location = /dev { return 308 https://dev.herong.info/$is_args$args; }
location ~ ^/dev/(.*)$ { return 308 https://dev.herong.info/$1$is_args$args; }
location = /test-dev { return 308 https://test-dev.herong.info/$is_args$args; }
location ~ ^/test-dev/(.*)$ { return 308 https://test-dev.herong.info/$1$is_args$args; }
