# Include ONLY inside the existing 101.96.210.172 HTTPS server on port 443.
# Keep that server's certificates, renewal timer and location / proxy unchanged.
# Never include this file at http context or inside another location.

location = /dev {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 308 /dev/;
}

location = /dev/404.html {
    internal;
    root /var/www/herong-dev-guides/current/web;
    try_files /404.html =404;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;
}

location ^~ /dev/_astro/ {
    root /var/www/herong-dev-guides/shared;
    autoindex off;
    if ($uri ~ "(^|/)[.]") { return 404; }
    rewrite ^/dev/(.*)$ /$1 break;
    try_files $uri =404;
    error_page 404 /dev/404.html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ^~ /dev/ {
    root /var/www/herong-dev-guides/current/web;
    autoindex off;
    if ($uri ~ "(^|/)[.]") { return 404; }
    if ($uri ~* "(^|/)(author|drafts|api|node_modules)(/|$)") { return 404; }
    # Resolve slash routes to a concrete file before try_files. Never select
    # a directory or let the index module redirect outside this prefix.
    rewrite ^/dev/$ /index.html break;
    rewrite ^/dev/(.*)/$ /$1/index.html break;
    rewrite ^/dev/(.*)$ /$1 break;
    try_files $uri =404;
    error_page 404 /dev/404.html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;
}

location = /test-dev {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 308 /test-dev/;
}

location = /test-dev/404.html {
    internal;
    root /var/www/herong-dev-guides-staging/current/web;
    try_files /404.html =404;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;
}

location ^~ /test-dev/_astro/ {
    root /var/www/herong-dev-guides-staging/shared;
    autoindex off;
    if ($uri ~ "(^|/)[.]") { return 404; }
    rewrite ^/test-dev/(.*)$ /$1 break;
    try_files $uri =404;
    error_page 404 /test-dev/404.html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ^~ /test-dev/ {
    root /var/www/herong-dev-guides-staging/current/web;
    autoindex off;
    if ($uri ~ "(^|/)[.]") { return 404; }
    if ($uri ~* "(^|/)(author|drafts|api|node_modules)(/|$)") { return 404; }
    # Resolve slash routes to a concrete file before try_files. Never select
    # a directory or let the index module redirect outside this prefix.
    rewrite ^/test-dev/$ /index.html break;
    rewrite ^/test-dev/(.*)/$ /$1/index.html break;
    rewrite ^/test-dev/(.*)$ /$1 break;
    try_files $uri =404;
    error_page 404 /test-dev/404.html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;
}
