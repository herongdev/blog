# Active only after the two certificates exist and author publishing uses domains.
# Content roots are isolated; only the production domain serves the author app.
server {
    listen 80;
    server_name dev.herong.info;
    location ^~ /.well-known/acme-challenge/ { root /var/www/herong-dev-guides-acme; default_type text/plain; }
    location / { return 308 https://dev.herong.info$request_uri; }
}
server {
    listen 80;
    server_name test-dev.herong.info;
    location ^~ /.well-known/acme-challenge/ { root /var/www/herong-dev-guides-acme; default_type text/plain; }
    location / { return 308 https://test-dev.herong.info$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name dev.herong.info;
    ssl_certificate /etc/letsencrypt/live/dev.herong.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.herong.info/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/herong-dev-guides-author-domain.conf;
    root /var/www/herong-dev-guides/current/web;
    index index.html;
    autoindex off;
    error_page 404 /404.html;
    location ~ (^|/)\. { return 404; }
    location ~* ^/(author|drafts|api|node_modules)(/|$) { return 404; }
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache" always;
    }
    location ^~ /_astro/ {
        root /var/www/herong-dev-guides/shared;
        if ($uri ~ "(^|/)[.]") { return 404; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
server {
    listen 443 ssl http2;
    server_name test-dev.herong.info;
    ssl_certificate /etc/letsencrypt/live/test-dev.herong.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-dev.herong.info/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/herong-dev-guides-staging/current/web;
    index index.html;
    autoindex off;
    error_page 404 /404.html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    location ~ (^|/)\. { return 404; }
    location ~* ^/(author|drafts|api|node_modules)(/|$) { return 404; }
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache" always;
    }
    location ^~ /_astro/ {
        root /var/www/herong-dev-guides-staging/shared;
        if ($uri ~ "(^|/)[.]") { return 404; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }
}
